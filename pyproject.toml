[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testdata-ai"
version = "0.10.0"
description = "AI-powered test data generator for QA engineers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "TestCraft AI", email = "testcraft.ai@protonmail.com"}
]
keywords = ["testing", "test-data", "ai", "qa", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "filelock>=3.12.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.10.0"]
anthropic = ["anthropic>=0.18.0"]
ollama = []  # No extra packages needed — uses stdlib urllib.request; requires a running Ollama instance
gemini = ["google-genai>=0.7.0"]
mistral = ["mistralai>=1.0.0"]
cohere = ["cohere>=5.0.0"]
faker = ["faker>=18.0"]
pandas = ["pandas>=1.3.0"]
all = ["openai>=1.10.0", "anthropic>=0.18.0", "google-genai>=0.7.0", "mistralai>=1.0.0", "cohere>=5.0.0", "faker>=18.0", "pandas>=1.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.2.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/testcraft-ai/testdata-ai"
Documentation = "https://github.com/testcraft-ai/testdata-ai/blob/main/README.md"
Repository = "https://github.com/testcraft-ai/testdata-ai"
"Bug Tracker" = "https://github.com/testcraft-ai/testdata-ai/issues"

[project.scripts]
testdata-ai = "testdata_ai.cli:cli"

[project.entry-points."pytest11"]
testdata-ai = "testdata_ai.pytest_plugin"

[tool.setuptools]
packages = ["testdata_ai"]

[tool.setuptools.package-data]
testdata_ai = ["py.typed"]

[tool.coverage.run]
source = ["testdata_ai"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"